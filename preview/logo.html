<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 32px; background: var(--surface-canvas); display:flex; align-items: center; justify-content: space-around; gap: 32px; }
  img { display:block; }
  .pair { display:flex; flex-direction: column; align-items: center; gap: 10px; }
  .lab { font: 500 10px/1 var(--font-mono); color: var(--fg-3); text-transform: uppercase; letter-spacing: var(--tracking-caps); }
</style>
</head>
<body>
  <div class="pair">
    <img src="../assets/logo-wordmark.svg" width="220" alt="Stark wordmark">
    <div class="lab">Wordmark · primary</div>
  </div>
  <div class="pair">
    <img src="../assets/logo-mark.svg" width="70" alt="Stark mark">
    <div class="lab">Mark · favicon</div>
  </div>
</body>
</html>
