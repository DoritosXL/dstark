<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--surface-canvas); display:grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .col .lab { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: var(--tracking-caps); margin-bottom: 8px; }
  .col .name { font-size: 13px; color: var(--fg-3); margin-bottom: 4px; }
  .sans { font-family: var(--font-sans); font-size: 34px; font-weight: 700; line-height: 1; color: var(--fg-1); letter-spacing: -0.02em; }
  .sans-row { font-family: var(--font-sans); font-size: 13px; color: var(--fg-2); margin-top: 8px; letter-spacing: 0.04em; }
  .serif { font-family: var(--font-serif); font-size: 34px; font-weight: 600; font-style: italic; line-height: 1; color: var(--fg-1); letter-spacing: -0.02em; }
  .serif-row { font-family: var(--font-serif); font-size: 14px; color: var(--fg-2); margin-top: 8px; font-style: italic; }
</style>
</head>
<body>
  <div class="col">
    <div class="lab">Nunito · 200–1000</div>
    <div class="sans">AaBbCc 0123</div>
    <div class="sans-row">200 · 400 · 600 · 800</div>
  </div>
  <div class="col">
    <div class="lab">Lora · 400–700</div>
    <div class="serif">AaBbCc 0123</div>
    <div class="serif-row">Regular · Italic · Display</div>
  </div>
</body>
</html>
