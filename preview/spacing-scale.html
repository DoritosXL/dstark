<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px 28px; background: var(--surface-canvas); }
  .row { display:flex; align-items: flex-end; gap: 18px; }
  .item { display:flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { background: var(--stark-ink-900); border-radius: 2px; width: var(--sz); height: var(--sz); }
  .lab { font: 500 10px/1 var(--font-mono); color: var(--fg-3); }
  .num { font: 600 11px/1 var(--font-sans); color: var(--fg-1); }
</style>
</head>
<body>
  <div class="row">
    <div class="item" style="--sz:4px"><div class="box"></div><div class="num">4</div><div class="lab">space-1</div></div>
    <div class="item" style="--sz:8px"><div class="box"></div><div class="num">8</div><div class="lab">space-2</div></div>
    <div class="item" style="--sz:12px"><div class="box"></div><div class="num">12</div><div class="lab">space-3</div></div>
    <div class="item" style="--sz:16px"><div class="box"></div><div class="num">16</div><div class="lab">space-4</div></div>
    <div class="item" style="--sz:20px"><div class="box"></div><div class="num">20</div><div class="lab">space-5</div></div>
    <div class="item" style="--sz:24px"><div class="box"></div><div class="num">24</div><div class="lab">space-6</div></div>
    <div class="item" style="--sz:32px"><div class="box"></div><div class="num">32</div><div class="lab">space-8</div></div>
    <div class="item" style="--sz:40px"><div class="box"></div><div class="num">40</div><div class="lab">space-10</div></div>
    <div class="item" style="--sz:48px"><div class="box"></div><div class="num">48</div><div class="lab">space-12</div></div>
    <div class="item" style="--sz:64px"><div class="box"></div><div class="num">64</div><div class="lab">space-16</div></div>
  </div>
</body>
</html>
